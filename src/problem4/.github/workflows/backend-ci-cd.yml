name: Backend CI/CD

# Assumes this workflow lives at the root of the backend's own repo,
# with application source under `backend/` (see SOLUTION.md for why).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Package app
        run: zip -r ../backend.zip .

      - name: Upload artifact to S3
        run: aws s3 cp ../backend.zip s3://my-company-deploy-artifacts/backend.zip

      - name: Install Ansible and the SSM session plugin
        run: |
          pip install --quiet ansible-core boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml
          curl -sSL "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb

      - name: Deploy to EC2 fleet via Ansible
        working-directory: backend/ansible
        run: ansible-playbook deploy.yml

      - name: Health check
        run: curl -fsS https://api.example.com/health
